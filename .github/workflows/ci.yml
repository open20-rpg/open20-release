name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # resvg renders the Discord banner; with it the tests cover that too.
      - run: npm install --prefix "$RUNNER_TEMP/resvg" --no-save --no-audit --no-fund @resvg/resvg-js@2.6.2
      - run: npm test
        env:
          RESVG_DIR: ${{ runner.temp }}/resvg

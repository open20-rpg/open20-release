name: release

# open20-release releases itself with its own `release` action. The repos use
# the actions by major version (`@v1`), so that tag follows the newest release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm test

      - uses: ./release
        id: release

      - name: move the major version tag
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"
